name: Phoenix Office Companion

on:
  pull_request:
    paths:
      - "config/office-companion.json"
      - "docs/companions/office-companion/**"
      - "src/companions/office-companion/**"
      - "scripts/validate-office-companion.mjs"
      - "package.json"
      - "tsconfig.json"
      - "tsconfig.build.json"
      - "Dockerfile"
      - ".dockerignore"
      - ".env.example"
      - ".github/workflows/office-companion.yml"
  push:
    branches:
      - main
    paths:
      - "config/office-companion.json"
      - "docs/companions/office-companion/**"
      - "src/companions/office-companion/**"
      - "scripts/validate-office-companion.mjs"
      - "package.json"
      - "tsconfig.json"
      - "tsconfig.build.json"
      - "Dockerfile"
      - ".dockerignore"
      - ".env.example"
      - ".github/workflows/office-companion.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gemini-reference-adapter-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Validate governance, anchors and provider boundary
        run: npm run validate:office

      - name: Typecheck provider-neutral contracts and runtime
        run: npm run typecheck

      - name: Run provider-neutral routing acceptance suite
        run: npm run acceptance:office

      - name: Run stateless HTTP server smoke tests
        run: npm run smoke:office-server

      - name: Run Gemini reference adapter acceptance with local mock
        run: npm run acceptance:office-gemini

      - name: Build production runtime
        run: npm run build:office

      - name: Build container image
        run: docker build -t phoenix-office-companion:ci .

      - name: Smoke test credential-free container
        shell: bash
        run: |
          set -eu
          container_id="$(docker run -d -p 18080:8080 phoenix-office-companion:ci)"
          cleanup() {
            docker logs "$container_id" || true
            docker rm -f "$container_id" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          attempts=0
          until node -e "fetch('http://127.0.0.1:18080/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"; do
            attempts=$((attempts + 1))
            if [ "$attempts" -ge 20 ]; then
              echo "Container health endpoint did not become ready"
              exit 1
            fi
            sleep 1
          done

          node <<'NODE'
          const readyResponse = await fetch('http://127.0.0.1:18080/ready');
          const ready = await readyResponse.json();
          if (!readyResponse.ok) throw new Error(JSON.stringify(ready));
          if (ready.status !== 'ready') throw new Error('Runtime did not report ready');
          if (ready.executiveOffice !== 'Billy') throw new Error('Billy ownership missing');
          if (ready.firstProductionTarget !== 'azure-container-apps') {
            throw new Error('Azure Container Apps target missing');
          }
          if (ready.liveProviderExecution !== false) {
            throw new Error('Credential-free runtime must not enable provider execution');
          }
          if (!Array.isArray(ready.operationalProviders) || ready.operationalProviders.length !== 0) {
            throw new Error('Credential-free runtime must have no operational provider');
          }

          const request = {
            requestId: 'container-complete-smoke',
            operatingMode: 'build',
            task: 'Create a sanitized decision memo',
            intendedOutcome: 'A review candidate',
            input: 'Public context only',
            contextReferences: [],
            dataClass: 'green',
            sanitizationState: 'not-required',
            excludedInformation: [],
            requiredCapabilities: ['reasoning'],
            allowedProviders: ['gemini', 'claude', 'chatgpt'],
            allowFallback: true,
            evidenceRequirements: {
              citationsRequired: false,
              approvedSourceIds: []
            },
            validationRequirements: {
              humanReviewRequired: true,
              internalValidationRequired: true
            },
            toolPermissions: [],
            createdAt: '2026-08-08T00:00:00.000Z'
          };
          const completeResponse = await fetch('http://127.0.0.1:18080/v1/complete', {
            method: 'POST',
            headers: { 'content-type': 'application/json' },
            body: JSON.stringify(request)
          });
          const complete = await completeResponse.json();
          if (completeResponse.status !== 503 || complete.code !== 'routing-rejected') {
            throw new Error(`Credential-free completion did not fail closed: ${JSON.stringify(complete)}`);
          }
          console.log(JSON.stringify(ready));
          NODE

      - name: Publish reference adapter summary
        shell: bash
        run: |
          {
            echo "## Phoenix Office Companion"
            echo "- Executive Office: Billy"
            echo "- Runtime: stateless containerized HTTP service"
            echo "- First production target: Azure Container Apps"
            echo "- Provider strategy: LLM-independent"
            echo "- Provider targets: Gemini, Claude, ChatGPT"
            echo "- Gemini: reference adapter implemented"
            echo "- Permanent default provider: none"
            echo "- Live execution: deployment-credential gated"
            echo "- CI provider call: local deterministic mock only"
            echo "- Human review: mandatory"
            echo "- Autonomous publication: disabled"
            echo "- Gemini reference adapter gate: passed"
          } >> "$GITHUB_STEP_SUMMARY"
