name: Phoenix Office Companion

on:
  pull_request:
    paths:
      - "config/office-companion.json"
      - "config/office-companion-evidence-review.json"
      - "docs/companions/office-companion/**"
      - "infra/office-companion/staging/**"
      - "src/companions/office-companion/**"
      - "scripts/validate-office-companion.mjs"
      - "scripts/validate-office-staging.mjs"
      - "scripts/validate-office-evidence-review.mjs"
      - "package.json"
      - "tsconfig.json"
      - "tsconfig.build.json"
      - "Dockerfile"
      - ".dockerignore"
      - ".env.example"
      - ".github/workflows/office-companion.yml"
      - ".github/workflows/office-companion-staging.yml"
      - ".github/workflows/office-companion-staging-preflight.yml"
  push:
    branches:
      - main
    paths:
      - "config/office-companion.json"
      - "config/office-companion-evidence-review.json"
      - "docs/companions/office-companion/**"
      - "infra/office-companion/staging/**"
      - "src/companions/office-companion/**"
      - "scripts/validate-office-companion.mjs"
      - "scripts/validate-office-staging.mjs"
      - "scripts/validate-office-evidence-review.mjs"
      - "package.json"
      - "tsconfig.json"
      - "tsconfig.build.json"
      - "Dockerfile"
      - ".dockerignore"
      - ".env.example"
      - ".github/workflows/office-companion.yml"
      - ".github/workflows/office-companion-staging.yml"
      - ".github/workflows/office-companion-staging-preflight.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  staging-foundation-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Validate governance and Drive anchors
        run: npm run validate:office

      - name: Validate staging definitions without Azure credentials
        run: npm run validate:office-staging

      - name: Validate provider evidence review gate
        run: npm run validate:office-evidence-review

      - name: Typecheck provider-neutral runtime and staging proof runner
        run: npm run typecheck

      - name: Run provider-neutral routing acceptance
        run: npm run acceptance:office

      - name: Run server smoke tests
        run: npm run smoke:office-server

      - name: Run Gemini adapter acceptance
        run: npm run acceptance:office-gemini

      - name: Run multi-provider adapter acceptance
        run: npm run acceptance:office-multi

      - name: Run staging evidence acceptance with local endpoint mock
        run: npm run acceptance:office-staging

      - name: Run evidence review acceptance
        run: npm run acceptance:office-evidence-review

      - name: Build production runtime
        run: npm run build:office

      - name: Build container image
        run: docker build -t phoenix-office-companion:ci .

      - name: Smoke test credential-free container
        shell: bash
        run: |
          set -eu
          container_id="$(docker run -d -p 18080:8080 phoenix-office-companion:ci)"
          cleanup() {
            docker logs "$container_id" || true
            docker rm -f "$container_id" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          attempts=0
          until node -e "fetch('http://127.0.0.1:18080/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"; do
            attempts=$((attempts + 1))
            if [ "$attempts" -ge 20 ]; then
              echo "Container health endpoint did not become ready"
              exit 1
            fi
            sleep 1
          done

          node <<'NODE'
          const response = await fetch('http://127.0.0.1:18080/ready');
          const body = await response.json();
          if (!response.ok || body.status !== 'ready') throw new Error(JSON.stringify(body));
          if (body.executiveOffice !== 'Billy') throw new Error('Billy ownership missing');
          if (body.liveProviderExecution !== false) {
            throw new Error('Credential-free runtime must not enable provider execution');
          }
          if ((body.operationalProviders || []).length !== 0) {
            throw new Error('Credential-free runtime must have no operational provider');
          }
          NODE

      - name: Publish staging-foundation summary
        shell: bash
        run: |
          {
            echo "## Phoenix Office Companion"
            echo "- Executive Office: Billy"
            echo "- Implemented providers: Gemini, Claude, ChatGPT"
            echo "- Permanent default: none"
            echo "- Staging target: Azure Container Apps"
            echo "- Deployment authentication: GitHub OIDC"
            echo "- Runtime identity: user-assigned managed identity"
            echo "- Provider secrets: Azure Key Vault references"
            echo "- Proof data class: GREEN"
            echo "- Evidence review gate: PHX-COMP-OFFICE-008"
            echo "- Automated promotion: prohibited"
            echo "- Pull-request deployment: disabled"
            echo "- Microsoft Graph writes: disabled"
            echo "- Staging foundation gate: passed"
          } >> "$GITHUB_STEP_SUMMARY"
